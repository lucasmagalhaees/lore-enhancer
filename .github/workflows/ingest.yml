# After a merge that changes the corpus, sends it to Supabase. Needs the repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_KEY. Adding is idempotent: what is already there stays, only new text goes in.
name: ingestão
on:
  push:
    branches: [main]
    paths: ['corpus/**']
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt
      - run: python3 scripts/ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
